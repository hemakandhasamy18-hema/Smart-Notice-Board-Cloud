<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Notice Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo-container">
            <span class="logo-icon">📢</span>
            <span>Smart Notice Board</span>
        </a>
        <div class="nav-links">
            <a href="register.html" class="btn btn-secondary btn-sm">Register</a>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to access your digital notice board</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
                </div>

                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.4rem;">
                        <label for="password" style="margin-bottom:0;">Password</label>
                        <a href="#" id="forgotPasswordBtn" style="font-size:0.8rem; color:var(--primary); text-decoration:none;">Forgot?</a>
                    </div>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" id="submitBtn" class="btn" style="width: 100%; margin-top: 0.5rem;">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
